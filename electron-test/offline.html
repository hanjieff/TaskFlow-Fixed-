<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>TaskFlow — cannot connect</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #30475E; color: #F5F5F5;
    font-family: system-ui, sans-serif; text-align: center;
  }
  .card { background: #222A33; padding: 40px 56px; border-radius: 16px; max-width: 420px; }
  .mark {
    display: inline-grid; place-items: center; width: 44px; height: 44px;
    background: #F05454; border-radius: 12px; font-weight: 800; font-size: 24px;
  }
  h1 { margin: 16px 0 8px; font-size: 22px; }
  p { color: #aab4bf; margin: 6px 0; font-size: 14px; }
  #reason { color: #F05454; font-size: 13px; }
  button {
    margin-top: 18px; padding: 10px 28px; border: 0; border-radius: 10px;
    background: #F05454; color: #F5F5F5; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #d84444; }
</style>
</head>
<body>
  <div class="card">
    <span class="mark">t</span>
    <h1>Can't reach TaskFlow</h1>
    <p id="reason"></p>
    <p>Check your internet connection, then try again.</p>
    <button id="retry" type="button">Try again</button>
  </div>
  <script>
    const params = new URLSearchParams(location.search)
    document.getElementById('reason').textContent = params.get('reason') || 'The server did not respond.'
    document.getElementById('retry').addEventListener('click', () => {
      location.href = params.get('url') || '/'
    })
  </script>
</body>
</html>
